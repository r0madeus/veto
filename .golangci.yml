version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      # Default checks, minus the purely stylistic "could use tagged switch".
      checks: ["all", "-QF1003", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    rules:
      # Unchecked results that are conventionally ignored (cleanup, best-effort output).
      - linters: [errcheck]
        text: 'Error return value of `.*\.(Close|Flush|Render|Remove|RemoveAll)` is not checked'
      - linters: [errcheck]
        text: 'Error return value of `(fmt\.(Fprint|Fprintf|Fprintln|Scanln|Sscanf)|io\.WriteString)` is not checked'
